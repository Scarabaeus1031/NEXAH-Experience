<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bead · Root Gap</title>
<style>
  :root {
    color-scheme: dark;
    --background: #181818;
    --foreground: #f4f0e7;
    --muted-foreground: #aaa49a;
    --font-size-base: 16px;
    --viz-series-1: #3b82f6;
    --viz-series-2: #f2cf55;
    --viz-series-3: #f08bc2;
    --yellow: #f6c735;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--background); color: var(--foreground); }
  body { padding: clamp(18px, 3vw, 34px); font: 16px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { margin: 0; font-size: clamp(1.45rem, 3vw, 2.25rem); line-height: 1.08; }
  p { margin: 0; }
  .text-muted { color: var(--muted-foreground); }
  .btn { appearance: none; padding: .58rem .78rem; border: 1px solid #4a4a4a; border-radius: 999px; background: #242424; color: var(--foreground); font: inherit; cursor: pointer; }
  .btn:hover { border-color: #777; }
  .btn-primary { border-color: var(--viz-series-3); background: #f08bc224; box-shadow: inset 0 0 0 1px #f08bc255; }
  .form-range { width: 100%; accent-color: var(--viz-series-3); }
  .tabular-nums { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root-gap-diagonal-measure">
  <style>
    #root-gap-diagonal-measure {
      color: var(--foreground);
      font-family: inherit;
      display: grid;
      gap: calc(var(--font-size-base) * 0.9);
    }
    #root-gap-diagonal-measure .rg-title {
      display: grid;
      gap: calc(var(--font-size-base) * 0.25);
    }
    #root-gap-diagonal-measure .rg-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: calc(var(--font-size-base) * 0.75);
    }
    #root-gap-diagonal-measure .rg-control {
      display: grid;
      gap: calc(var(--font-size-base) * 0.3);
    }
    #root-gap-diagonal-measure .rg-label-row {
      display: flex;
      justify-content: space-between;
      gap: calc(var(--font-size-base) * 0.5);
    }
    #root-gap-diagonal-measure .rg-stage {
      width: 100%;
      height: auto;
      display: block;
    }
    #root-gap-diagonal-measure .rg-stage text {
      fill: var(--foreground);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 400;
    }
    #root-gap-diagonal-measure .rg-stage .muted { fill: var(--muted-foreground); }
    #root-gap-diagonal-measure .rg-stage .grid {
      stroke: color-mix(in srgb, var(--foreground) 12%, var(--background));
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    #root-gap-diagonal-measure .rg-stage .axis {
      stroke: color-mix(in srgb, var(--foreground) 35%, var(--background));
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    #root-gap-diagonal-measure .rg-stage .yellow-line {
      stroke: var(--yellow);
      stroke-width: 3;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    #root-gap-diagonal-measure .rg-stage .white-line {
      stroke: var(--foreground);
      stroke-width: 2.5;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    #root-gap-diagonal-measure .rg-stage .gap-fill {
      fill: color-mix(in srgb, var(--viz-series-1) 24%, transparent);
      stroke: none;
    }
    #root-gap-diagonal-measure .rg-stage .gap-edge {
      stroke: var(--viz-series-1);
      stroke-width: 1.8;
      fill: none;
      stroke-dasharray: 5 4;
      vector-effect: non-scaling-stroke;
    }
    #root-gap-diagonal-measure .rg-stage .bead {
      fill: var(--viz-series-3);
      stroke: var(--background);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    #root-gap-diagonal-measure .rg-stage .nearest {
      fill: var(--background);
      stroke: var(--viz-series-3);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    #root-gap-diagonal-measure .rg-stage .intersection {
      fill: var(--viz-series-2);
      stroke: var(--background);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }
    #root-gap-diagonal-measure .rg-stage .leader {
      stroke: var(--muted-foreground);
      stroke-width: 1;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    #root-gap-diagonal-measure .rg-readout {
      color: var(--muted-foreground);
      min-height: calc(var(--font-size-base) * 1.5);
    }
    @media (max-width: 620px) {
      #root-gap-diagonal-measure .rg-controls { grid-template-columns: 1fr; }
    }
  </style>

  <div class="rg-title">
    <h1>Root-Gap zwischen gelber und weißer Diagonale</h1>
    <p class="text-muted">Einheitenlose Projektionsmessung: Versatz und Winkel erzeugen ein Spaltprofil; die Bead liest eine lokale Breite aus.</p>
  </div>

  <div class="rg-controls">
    <label class="rg-control" for="rg-offset">
      <span class="rg-label-row"><span>Normalversatz δ</span><strong id="rg-offset-value" class="tabular-nums">0.55</strong></span>
      <input id="rg-offset" class="form-range" type="range" min="0" max="120" step="1" value="14">
    </label>
    <label class="rg-control" for="rg-angle">
      <span class="rg-label-row"><span>Winkeldifferenz Δθ</span><strong id="rg-angle-value" class="tabular-nums">7°</strong></span>
      <input id="rg-angle" class="form-range" type="range" min="-16" max="16" step="1" value="-15">
    </label>
    <label class="rg-control" for="rg-bead">
      <span class="rg-label-row"><span>Bead-Position s</span><strong id="rg-bead-value" class="tabular-nums">62%</strong></span>
      <input id="rg-bead" class="form-range" type="range" min="0" max="100" step="1" value="29">
    </label>
  </div>

  <div class="viz-grid">
    <div class="card viz-stat"><span class="text-muted">lokaler Spalt g(s)</span><strong id="rg-local" class="viz-stat-value tabular-nums">—</strong></div>
    <div class="card viz-stat"><span class="text-muted">Spannweite gmin → gmax</span><strong id="rg-span" class="viz-stat-value tabular-nums">—</strong></div>
    <div class="card viz-stat"><span class="text-muted">Spaltfläche AG</span><strong id="rg-area" class="viz-stat-value tabular-nums">—</strong></div>
  </div>

  <svg class="rg-stage" viewBox="0 0 960 470" role="img" aria-labelledby="rg-svg-title rg-svg-desc">
    <title id="rg-svg-title">Messung des Spalts zwischen zwei Diagonalen</title>
    <desc id="rg-svg-desc">Eine gelbe Referenzdiagonale und eine weiße bewegliche Diagonale bilden einen gefüllten Spalt. Eine Bead wandert auf der gelben Linie. Eine senkrechte Messstrecke zeigt ihren lokalen Abstand zur weißen Linie.</desc>
    <g id="rg-grid"></g>
    <g id="rg-drawing"></g>
  </svg>

  <p id="rg-readout" class="rg-readout" aria-live="polite"></p>

  <script>
    (() => {
      const root = document.getElementById('root-gap-diagonal-measure');
      const grid = root.querySelector('#rg-grid');
      const drawing = root.querySelector('#rg-drawing');
      const offsetInput = root.querySelector('#rg-offset');
      const angleInput = root.querySelector('#rg-angle');
      const beadInput = root.querySelector('#rg-bead');
      const offsetValue = root.querySelector('#rg-offset-value');
      const angleValue = root.querySelector('#rg-angle-value');
      const beadValue = root.querySelector('#rg-bead-value');
      const localValue = root.querySelector('#rg-local');
      const spanValue = root.querySelector('#rg-span');
      const areaValue = root.querySelector('#rg-area');
      const readout = root.querySelector('#rg-readout');
      const storageKey = 'nexah:scc003:root-gap-diagonal-measure:v1';
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(storageKey) || 'null'); } catch {}
      let offset = saved && Number.isFinite(saved.offset) ? Math.max(0, Math.min(1.2, saved.offset)) : 0.14;
      let angleDeg = saved && Number.isFinite(saved.angleDeg) ? Math.max(-16, Math.min(16, saved.angleDeg)) : -15;
      let bead = saved && Number.isFinite(saved.bead) ? Math.max(0, Math.min(1, saved.bead)) : 0.29;

      const cx=480, cy=240, scale=72, length=10;
      const alpha=-22*Math.PI/180;
      const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
      const sub=(a,b)=>[a[0]-b[0],a[1]-b[1]];
      const mul=(a,k)=>[a[0]*k,a[1]*k];
      const dot=(a,b)=>a[0]*b[0]+a[1]*b[1];
      const screen=p=>[cx+p[0]*scale,cy-p[1]*scale];
      const line=(a,b,cls)=>'<line class="'+cls+'" x1="'+a[0].toFixed(2)+'" y1="'+a[1].toFixed(2)+'" x2="'+b[0].toFixed(2)+'" y2="'+b[1].toFixed(2)+'"/>';
      const point=(p,cls,r=7)=>'<circle class="'+cls+'" cx="'+p[0].toFixed(2)+'" cy="'+p[1].toFixed(2)+'" r="'+r+'"/>';
      const polygon=(points,cls)=>'<polygon class="'+cls+'" points="'+points.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ')+'"/>';

      function drawGrid(){
        let out='';
        for(let x=120;x<=840;x+=72)out+='<line class="grid" x1="'+x+'" y1="55" x2="'+x+'" y2="425"/>';
        for(let y=60;y<=420;y+=72)out+='<line class="grid" x1="110" y1="'+y+'" x2="850" y2="'+y+'"/>';
        out+='<line class="axis" x1="110" y1="240" x2="850" y2="240"/><line class="axis" x1="480" y1="55" x2="480" y2="425"/>';
        grid.innerHTML=out;
      }

      function calculate(){
        const theta=angleDeg*Math.PI/180;
        const dY=[Math.cos(alpha),Math.sin(alpha)];
        const nY=[-Math.sin(alpha),Math.cos(alpha)];
        const dW=[Math.cos(alpha+theta),Math.sin(alpha+theta)];
        const nW=[-Math.sin(alpha+theta),Math.cos(alpha+theta)];
        const qW=mul(nY,offset);
        const pY=t=>mul(dY,(t-0.5)*length);
        const signedGap=p=>dot(nW,sub(p,qW));
        const nearest=p=>sub(p,mul(nW,signedGap(p)));
        const p0=pY(0),p1=pY(1),pb=pY(bead);
        const w0=nearest(p0),w1=nearest(p1),wb=nearest(pb);
        const g0=signedGap(p0),g1=signedGap(p1),gb=signedGap(pb);
        const abs0=Math.abs(g0),abs1=Math.abs(g1),absb=Math.abs(gb);
        const crosses=g0===0||g1===0||g0*g1<0;
        const gmin=crosses?0:Math.min(abs0,abs1);
        const gmax=Math.max(abs0,abs1);
        let area;
        if(crosses){
          const t0=abs0/(abs0+abs1||1);
          area=length*0.5*(abs0*t0+abs1*(1-t0));
        }else{
          area=length*(abs0+abs1)/2;
        }
        let crossPoint=null;
        const denom=dot(nW,dY);
        if(Math.abs(denom)>1e-8){
          const u=dot(nW,qW)/denom;
          if(u>=-length/2&&u<=length/2)crossPoint=mul(dY,u);
        }
        return {dY,dW,p0,p1,pb,w0,w1,wb,absb,gmin,gmax,area,crossPoint,crosses};
      }

      function save(){
        localStorage.setItem(storageKey,JSON.stringify({offset,angleDeg,bead}));
      }
      function render(shouldSave=false){
        offsetInput.value=String(Math.round(offset*100));
        angleInput.value=String(angleDeg);
        beadInput.value=String(Math.round(bead*100));
        offsetValue.textContent=offset.toFixed(2);
        angleValue.textContent=angleDeg+'°';
        beadValue.textContent=Math.round(bead*100)+'%';
        const m=calculate();
        const sy0=screen(m.p0),sy1=screen(m.p1),sb=screen(m.pb);
        const sw0=screen(m.w0),sw1=screen(m.w1),swb=screen(m.wb);
        let out=polygon([sy0,sy1,sw1,sw0],'gap-fill');
        out+=line(sy0,sy1,'yellow-line')+line(sw0,sw1,'white-line');
        out+=line(sb,swb,'gap-edge')+point(sb,'bead',8)+point(swb,'nearest',6);
        if(m.crossPoint)out+=point(screen(m.crossPoint),'intersection',6);
        out+='<text x="135" y="76">gelbe Referenz Lᵧ</text><text x="685" y="404">weiße Diagonale L𝑤</text>';
        out+='<text x="'+(sb[0]+12).toFixed(2)+'" y="'+(sb[1]-13).toFixed(2)+'">Bead</text>';
        out+='<text x="'+((sb[0]+swb[0])/2+10).toFixed(2)+'" y="'+((sb[1]+swb[1])/2).toFixed(2)+'" class="muted">g(s)</text>';
        drawing.innerHTML=out;
        localValue.textContent=m.absb.toFixed(3);
        spanValue.textContent=m.gmin.toFixed(3)+' → '+m.gmax.toFixed(3);
        areaValue.textContent=m.area.toFixed(3);
        if(Math.abs(angleDeg)<0.001){
          readout.textContent='Paralleler Fall: Der Root-Gap besitzt über die gesamte Strecke dieselbe Breite.';
        }else if(m.crosses){
          readout.textContent='Keilfall mit Nullpunkt: Die Diagonalen schneiden sich; dort schließt sich der Gap, danach öffnet er sich mit umgekehrtem Vorzeichen.';
        }else{
          readout.textContent='Versatz plus Drehung: Der Gap bleibt offen, verändert seine Breite aber entlang der gelben Referenz.';
        }
        if(shouldSave)save();
      }
      offsetInput.addEventListener('input',()=>{offset=Number(offsetInput.value)/100;render(true);});
      angleInput.addEventListener('input',()=>{angleDeg=Number(angleInput.value);render(true);});
      beadInput.addEventListener('input',()=>{bead=Number(beadInput.value)/100;render(true);});
      drawGrid();
      render(false);
    })();
  </script>
</div>
</body>
</html>
